<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Hostname}} // REMOTE VIEW</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00d4d4;
            --cyan-glow: rgba(0, 212, 212, 0.4);
            --cyan-subtle: rgba(0, 212, 212, 0.08);
            --magenta: #d400aa;
            --bg: #08090c;
            --bg-card: #0c0e12;
            --bg-darker: #050507;
            --border: rgba(0, 212, 212, 0.15);
            --text: #b8c5c5;
            --text-dim: #4a5858;
            --success: #00c896;
            --warning: #c8a000;
            --danger: #c84040;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IBM Plex Mono', monospace;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 0.75rem 1.5rem;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .toolbar-brand {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
        }

        .toolbar-brand .host {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--cyan);
            letter-spacing: 0.1em;
        }

        .toolbar-brand .jp {
            font-size: 0.65rem;
            color: var(--text-dim);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--danger);
        }

        .status-dot.connected {
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
        }

        .toolbar-controls {
            display: flex;
            gap: 0.5rem;
            margin-left: auto;
        }

        .btn-tool {
            padding: 0.5rem 0.875rem;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-tool:hover {
            border-color: var(--cyan);
            color: var(--cyan);
        }

        .btn-tool.active {
            border-color: var(--cyan);
            background: var(--cyan-subtle);
            color: var(--cyan);
        }

        .btn-tool.danger:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        /* Main layout */
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Screen area */
        .screen-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-darker);
            position: relative;
        }

        #remoteScreen {
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.8);
        }

        #remoteScreen.interactive {
            cursor: default;
        }

        .screen-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
            background: rgba(5, 5, 7, 0.95);
        }

        .screen-overlay.hidden {
            display: none;
        }

        .spinner-large {
            width: 32px;
            height: 32px;
            border: 2px solid var(--border);
            border-top-color: var(--cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .overlay-text {
            font-size: 0.8rem;
            color: var(--text-dim);
            letter-spacing: 0.1em;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar.hidden {
            display: none;
        }

        .panel {
            border-bottom: 1px solid var(--border);
        }

        .panel-header {
            padding: 0.875rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }

        .panel-header:hover {
            background: var(--cyan-subtle);
        }

        .panel-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            font-weight: 500;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        .panel-toggle {
            font-size: 0.6rem;
            color: var(--text-dim);
        }

        .panel-body {
            padding: 1rem;
            display: none;
        }

        .panel.open .panel-body {
            display: block;
        }

        .panel.open .panel-toggle {
            transform: rotate(180deg);
        }

        /* Info grid */
        .info-grid {
            display: grid;
            gap: 0.625rem;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
        }

        .info-row .label {
            color: var(--text-dim);
        }

        .info-row .value {
            color: var(--text);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
        }

        /* Settings */
        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }

        .setting-row:last-child {
            margin-bottom: 0;
        }

        .setting-label {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .setting-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .setting-control select {
            padding: 0.375rem 0.5rem;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.7rem;
        }

        .setting-control select:focus {
            outline: none;
            border-color: var(--cyan);
        }

        .setting-value {
            font-size: 0.7rem;
            color: var(--cyan);
            min-width: 2rem;
            text-align: right;
        }

        input[type="range"] {
            width: 80px;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: var(--cyan);
            border-radius: 50%;
            cursor: pointer;
        }

        /* Command input */
        .command-wrapper {
            display: flex;
            gap: 0.5rem;
        }

        .command-input {
            flex: 1;
            padding: 0.625rem 0.75rem;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.8rem;
        }

        .command-input:focus {
            outline: none;
            border-color: var(--cyan);
        }

        .command-input::placeholder {
            color: var(--text-dim);
        }

        .btn-run {
            padding: 0.625rem 0.875rem;
            background: var(--cyan-subtle);
            border: 1px solid var(--cyan);
            color: var(--cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-run:hover {
            background: var(--cyan);
            color: var(--bg);
        }

        .command-output {
            margin-top: 0.75rem;
            padding: 0.75rem;
            background: var(--bg);
            border: 1px solid var(--border);
            font-size: 0.7rem;
            max-height: 150px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-all;
            color: var(--success);
        }

        .command-output.error {
            color: var(--danger);
        }

        /* File browser */
        .file-list {
            max-height: 200px;
            overflow: auto;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
            cursor: pointer;
            border-radius: 2px;
            font-size: 0.75rem;
        }

        .file-item:hover {
            background: var(--cyan-subtle);
        }

        .file-item .icon {
            color: var(--text-dim);
            font-size: 0.8rem;
        }

        .file-item.dir .icon {
            color: var(--cyan);
        }

        .file-item .name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-path {
            padding: 0.5rem;
            background: var(--bg);
            border: 1px solid var(--border);
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .file-path .path {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-path .btn-up {
            padding: 0.25rem 0.5rem;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 0.6rem;
            cursor: pointer;
        }

        .file-path .btn-up:hover {
            border-color: var(--cyan);
            color: var(--cyan);
        }

        /* Mode indicator */
        .mode-indicator {
            position: absolute;
            top: 1rem;
            left: 1rem;
            padding: 0.375rem 0.75rem;
            background: rgba(8, 9, 12, 0.9);
            border: 1px solid var(--border);
            font-size: 0.65rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .mode-indicator.interactive {
            border-color: var(--magenta);
            color: var(--magenta);
        }

        /* Stats bar */
        .stats-bar {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            display: flex;
            gap: 1.5rem;
            padding: 0.5rem 0.75rem;
            background: rgba(8, 9, 12, 0.9);
            border: 1px solid var(--border);
            font-size: 0.65rem;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stat-label {
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            color: var(--cyan);
            font-family: 'Orbitron', sans-serif;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <div class="toolbar-brand">
            <span class="host">{{.Hostname}}</span>
            <span class="jp">接続中</span>
        </div>
        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Connecting</span>
        </div>
        <div class="toolbar-controls">
            <button class="btn-tool active" id="btnView" title="View only">View</button>
            <button class="btn-tool" id="btnControl" title="Take control">Control</button>
            <button class="btn-tool" id="btnTerminal" title="Terminal view">Term</button>
            <button class="btn-tool" id="btnFullscreen" title="Fullscreen">◱</button>
            <button class="btn-tool" id="btnSidebar" title="Toggle panel">Panel</button>
            <button class="btn-tool danger" id="btnDisconnect">End</button>
        </div>
    </div>

    <div class="main">
        <div class="screen-area" id="screenArea">
            <img id="remoteScreen" alt="Remote display">
            
            <div class="mode-indicator" id="modeIndicator">View Only</div>
            
            <div class="stats-bar">
                <div class="stat">
                    <span class="stat-label">Res</span>
                    <span class="stat-value" id="statRes">—</span>
                </div>
                <div class="stat">
                    <span class="stat-label">FPS</span>
                    <span class="stat-value" id="statFps">—</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Latency</span>
                    <span class="stat-value" id="statLatency">—</span>
                </div>
            </div>

            <div class="screen-overlay" id="overlay">
                <div class="spinner-large"></div>
                <div class="overlay-text">Establishing connection...</div>
            </div>
        </div>

        <div class="sidebar" id="sidebar">
            <div class="panel open">
                <div class="panel-header">
                    <span class="panel-title">System</span>
                    <span class="panel-toggle">▼</span>
                </div>
                <div class="panel-body">
                    <div class="info-grid">
                        <div class="info-row">
                            <span class="label">OS</span>
                            <span class="value" id="infoOs">—</span>
                        </div>
                        <div class="info-row">
                            <span class="label">Address</span>
                            <span class="value" id="infoIp">—</span>
                        </div>
                        <div class="info-row">
                            <span class="label">Uptime</span>
                            <span class="value" id="infoUptime">—</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="panel open">
                <div class="panel-header">
                    <span class="panel-title">Stream</span>
                    <span class="panel-toggle">▼</span>
                </div>
                <div class="panel-body">
                    <div class="setting-row">
                        <span class="setting-label">Quality</span>
                        <div class="setting-control">
                            <input type="range" id="qualitySlider" min="10" max="80" value="40">
                            <span class="setting-value" id="qualityValue">40</span>
                        </div>
                    </div>
                    <div class="setting-row">
                        <span class="setting-label">Frame rate</span>
                        <div class="setting-control">
                            <select id="fpsSelect">
                                <option value="2">2 fps</option>
                                <option value="5" selected>5 fps</option>
                                <option value="10">10 fps</option>
                                <option value="15">15 fps</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">Execute</span>
                    <span class="panel-toggle">▼</span>
                </div>
                <div class="panel-body">
                    <div class="command-wrapper">
                        <input type="text" class="command-input" id="cmdInput" placeholder="Command...">
                        <button class="btn-run" id="btnRun">Run</button>
                    </div>
                    <div class="command-output" id="cmdOutput">Ready</div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">Files</span>
                    <span class="panel-toggle">▼</span>
                </div>
                <div class="panel-body">
                    <div class="file-path">
                        <span class="path" id="currentPath">/</span>
                        <button class="btn-up" id="btnUp">↑</button>
                    </div>
                    <div class="file-list" id="fileList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const hostname = '{{.Hostname}}';
        const baseURL = '{{.BaseURL}}';
        
        let isInteractive = false;
        let eventSource = null;
        let frameCount = 0;
        let lastFpsUpdate = Date.now();
        let currentPath = '/';

        const screen = document.getElementById('remoteScreen');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const overlay = document.getElementById('overlay');
        const modeIndicator = document.getElementById('modeIndicator');

        // Panel toggle
        document.querySelectorAll('.panel-header').forEach(header => {
            header.addEventListener('click', () => {
                header.parentElement.classList.toggle('open');
            });
        });

        // Connect to stream
        function connect() {
            const quality = document.getElementById('qualitySlider').value;
            const fps = document.getElementById('fpsSelect').value;
            
            if (eventSource) eventSource.close();

            eventSource = new EventSource(`${baseURL}/screen/stream?quality=${quality}&fps=${fps}`);
            
            eventSource.onopen = () => {
                statusDot.classList.add('connected');
                statusText.textContent = 'Connected';
                overlay.classList.add('hidden');
            };

            eventSource.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    const start = performance.now();
                    screen.src = 'data:image/jpeg;base64,' + data.data;
                    
                    document.getElementById('statRes').textContent = `${data.width}×${data.height}`;
                    document.getElementById('statLatency').textContent = `${Math.round(performance.now() - start)}ms`;
                    
                    frameCount++;
                    const now = Date.now();
                    if (now - lastFpsUpdate >= 1000) {
                        document.getElementById('statFps').textContent = frameCount;
                        frameCount = 0;
                        lastFpsUpdate = now;
                    }
                } catch (err) {
                    console.error('Frame error:', err);
                }
            };

            eventSource.onerror = () => {
                statusDot.classList.remove('connected');
                statusText.textContent = 'Reconnecting';
                overlay.classList.remove('hidden');
                setTimeout(connect, 3000);
            };
        }

        // Load system info
        async function loadInfo() {
            try {
                const resp = await fetch(`${baseURL}/`);
                const info = await resp.json();
                document.getElementById('infoOs').textContent = `${info.os}/${info.arch}`;
                document.getElementById('infoIp').textContent = info.tailscale_ip;
                document.getElementById('infoUptime').textContent = info.uptime;
            } catch (err) {
                console.error('Info error:', err);
            }
        }

        // Mouse handling
        screen.addEventListener('click', async (e) => {
            if (!isInteractive) return;
            
            const rect = screen.getBoundingClientRect();
            const scaleX = screen.naturalWidth / rect.width;
            const scaleY = screen.naturalHeight / rect.height;
            const x = Math.round((e.clientX - rect.left) * scaleX);
            const y = Math.round((e.clientY - rect.top) * scaleY);

            await fetch(`${baseURL}/input/mouse`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action: 'click', x, y})
            });
        });

        // Keyboard handling
        document.addEventListener('keydown', async (e) => {
            if (!isInteractive) return;
            if (document.activeElement.tagName === 'INPUT') return;
            
            e.preventDefault();
            await fetch(`${baseURL}/input/keyboard`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action: 'type', text: e.key})
            });
        });

        // Command execution
        document.getElementById('btnRun').addEventListener('click', runCommand);
        document.getElementById('cmdInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') runCommand();
        });

        async function runCommand() {
            const input = document.getElementById('cmdInput');
            const output = document.getElementById('cmdOutput');
            const cmd = input.value.trim();
            if (!cmd) return;

            output.textContent = 'Running...';
            output.classList.remove('error');
            
            try {
                const parts = cmd.match(/(?:[^\s"]+|"[^"]*")+/g) || [];
                const resp = await fetch(`${baseURL}/exec`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        command: parts[0],
                        args: parts.slice(1).map(p => p.replace(/^"|"$/g, '')),
                        hidden: true
                    })
                });
                const result = await resp.json();
                output.textContent = result.stdout || result.stderr || '(no output)';
                if (result.error || result.exit_code !== 0) {
                    output.classList.add('error');
                    if (result.error) output.textContent = result.error;
                }
            } catch (err) {
                output.textContent = err.message;
                output.classList.add('error');
            }
        }

        // File browser
        async function loadFiles(path) {
            currentPath = path;
            document.getElementById('currentPath').textContent = path;
            const list = document.getElementById('fileList');
            
            try {
                const resp = await fetch(`${baseURL}/files/list?path=${encodeURIComponent(path)}`);
                const files = await resp.json();
                
                list.innerHTML = files.map(f => `
                    <div class="file-item ${f.is_dir ? 'dir' : ''}" data-path="${f.path}" data-dir="${f.is_dir}">
                        <span class="icon">${f.is_dir ? '▸' : '·'}</span>
                        <span class="name">${f.name}</span>
                    </div>
                `).join('');

                list.querySelectorAll('.file-item').forEach(item => {
                    item.addEventListener('click', () => {
                        if (item.dataset.dir === 'true') {
                            loadFiles(item.dataset.path);
                        }
                    });
                });
            } catch (err) {
                list.innerHTML = `<div style="padding: 0.5rem; color: var(--danger);">Error loading</div>`;
            }
        }

        document.getElementById('btnUp').addEventListener('click', () => {
            const parent = currentPath.split('/').slice(0, -1).join('/') || '/';
            loadFiles(parent);
        });

        // Toolbar buttons
        document.getElementById('btnView').addEventListener('click', () => {
            isInteractive = false;
            screen.classList.remove('interactive');
            modeIndicator.classList.remove('interactive');
            modeIndicator.textContent = 'View Only';
            document.getElementById('btnView').classList.add('active');
            document.getElementById('btnControl').classList.remove('active');
        });

        document.getElementById('btnControl').addEventListener('click', () => {
            isInteractive = true;
            screen.classList.add('interactive');
            modeIndicator.classList.add('interactive');
            modeIndicator.textContent = 'Interactive';
            document.getElementById('btnControl').classList.add('active');
            document.getElementById('btnView').classList.remove('active');
        });

        document.getElementById('btnFullscreen').addEventListener('click', () => {
            document.getElementById('screenArea').requestFullscreen();
        });

        document.getElementById('btnSidebar').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('hidden');
        });

        document.getElementById('btnTerminal').addEventListener('click', () => {
            if (eventSource) eventSource.close();
            const params = new URLSearchParams(window.location.search);
            window.location.href = `/terminal?host=${params.get('host') || ''}&name=${params.get('name') || ''}`;
        });

        document.getElementById('btnDisconnect').addEventListener('click', () => {
            if (eventSource) eventSource.close();
            window.location.href = '/clients';
        });

        // Settings
        document.getElementById('qualitySlider').addEventListener('input', (e) => {
            document.getElementById('qualityValue').textContent = e.target.value;
        });
        document.getElementById('qualitySlider').addEventListener('change', connect);
        document.getElementById('fpsSelect').addEventListener('change', connect);

        // Init
        connect();
        loadInfo();
        loadFiles('/');
        setInterval(loadInfo, 30000);
    </script>
</body>
</html>
